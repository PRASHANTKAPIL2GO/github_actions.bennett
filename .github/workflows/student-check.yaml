name: Student Repository Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  student-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display student information
        run: |
          echo "===== STUDENT INFORMATION ====="
          echo "Student Name:"
          grep "^Name:" student.txt || echo "Name not found"

          echo "Roll Number:"
          grep "^Roll Number:" student.txt || echo "Roll Number not found"

          echo "===== DATE AND TIME ====="
          date

          echo "===== REPOSITORY INFORMATION ====="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Verify student.txt exists
        run: |
          echo "Checking student.txt..."

          if [ -f "student.txt" ]; then
            echo "student.txt exists."
          else
            echo "ERROR: student.txt was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Display student.txt contents
        run: |
          echo "===== student.txt CONTENTS ====="
          cat student.txt

      - name: Count lines in student.txt
        run: |
          echo "===== LINE COUNT ====="
          wc -l student.txt

      - name: Search for GitHub
        run: |
          echo "===== SEARCHING FOR GitHub ====="

          if grep -qi "GitHub" student.txt; then
            echo "The word GitHub was found."
          else
            echo "The word GitHub was not found."
          fi

      - name: Create report
        run: |
          echo "Student repository verification completed." > report.txt

          echo "===== REPORT ====="
          cat report.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-report
          path: report.txt